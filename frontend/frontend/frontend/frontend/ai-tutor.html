<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMMZY INTELLECTICAL AI Tutor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>EMMZY INTELLECTICAL AI</h1>
    <h2>AI PERSONAL TUTOR</h2>

    <p>Ask any JAMB question.</p>

    <input
        type="text"
        id="question"
        placeholder="Type your question here..."
    >

    <button onclick="askAI()">Ask EMMZY AI</button>

    <div id="answer">
        Your AI answers will appear here.
    </div>

    <script>
        async function askAI() {
            const question = document.getElementById("question").value;
            const answer = document.getElementById("answer");

            if (!question.trim()) {
                answer.innerText = "Please enter a question.";
                return;
            }

            answer.innerText = "EMMZY AI is thinking...";

            try {
                const response = await fetch(
                    "YOUR_RENDER_BACKEND_URL/api/ai/ask",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ question })
                    }
                );

                const data = await response.json();

                answer.innerText = data.answer || data.message;

            } catch (error) {
                answer.innerText = "Unable to connect to EMMZY AI.";
            }
        }
    </script>

</body>
</html>
